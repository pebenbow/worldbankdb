name: Deploy

on:
  push:
    branches: [main]

jobs:
  migrate:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    environment: supabase_prod
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Smoke test migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pytest -m schema -v --junit-xml=smoke-results.xml

      - name: Publish smoke test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Migration Smoke Tests
          path: smoke-results.xml
          reporter: java-junit
